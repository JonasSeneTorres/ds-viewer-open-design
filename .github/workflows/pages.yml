# Testa o site e, na branch main, publica no GitHub Pages.
# Para ativar: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Testes (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # o CSS usa color-mix, dvh, :has e color-scheme: os três motores rodam a mesma suíte
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Sintaxe do JavaScript
        run: npm run check:js
      - name: Testes unitários (JS e Python)
        run: npm run test:unit
      - name: Consistência dos dados
        run: python scripts/check_data.py
      - name: HTML dos guias
        run: python scripts/check_html.py
      - name: Instalar o navegador do Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Testes E2E
        run: npm run test:e2e
        env:
          PW_BROWSERS: ${{ matrix.browser }}

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site (só o que o navegador usa)
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/assets
          cp -r data/ds data/themes _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
